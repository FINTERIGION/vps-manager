# vpsm subscription - user: __USER__
# Requires the Mihomo (Clash Meta) core: original Clash does not support VLESS Reality
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
profile:
  store-selected: true
  store-fake-ip: true

hosts:
  dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
  doh.pub:
    - 1.12.12.12
    - 120.53.53.53
  dns.cloudflare.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.google:
    - 8.8.8.8
    - 8.8.4.4

dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - geosite:private
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  nameserver:
    - "https://dns.cloudflare.com/dns-query#Proxy-DNS"
    - "https://dns.google/dns-query#Proxy-DNS"
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

proxies:
  - name: "__NODE__"  # vpsm-local
    type: vless
    server: __SERVER__
    port: __PORT__
    uuid: __UUID__
    network: tcp
    udp: __UDP__
    ip-version: ipv4
    tls: true
    flow: xtls-rprx-vision
    servername: __SNI__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PBK__
      short-id: __SID__
      support-x25519mlkem768: __MLKEM__
  # __EXTRA_PROXIES__

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - "__NODE__"
      # __EXTRA_NAMES__
      - DIRECT
  - name: Steam
    type: select
    proxies:
      - Proxy
      - DIRECT
      - "__NODE__"
      # __EXTRA_NAMES__
  - name: WebRTC
    type: select
    proxies:
      - REJECT
      - Proxy
      - DIRECT
      - "__NODE__"
      # __EXTRA_NAMES__
  - name: Final
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: Proxy-DNS
    type: fallback
    hidden: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "__NODE__"
      # __EXTRA_NAMES__

# testingcf.jsdelivr.net is reachable from China without a proxy
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
