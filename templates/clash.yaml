  telegram:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.yaml"
    path: ./ruleset/telegram.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
  steam-cn:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam@cn.yaml"
    path: ./ruleset/steam-cn.yaml
    interval: 86400
  steam:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam.yaml"
    path: ./ruleset/steam.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

rules:
  # __CUSTOM_RULES__
  # The server blocks proxied connections to its own addresses, so services on this VPS go direct
  # __SERVER_RULES__
  - DST-PORT,853,REJECT
  - IP-CIDR,8.8.8.8/32,Proxy,no-resolve
  - IP-CIDR,8.8.4.4/32,Proxy,no-resolve
  - IP-CIDR,1.1.1.1/32,Proxy,no-resolve
  - IP-CIDR,1.0.0.1/32,Proxy,no-resolve
  - IP-CIDR,9.9.9.9/32,Proxy,no-resolve
  - IP-CIDR,149.112.112.112/32,Proxy,no-resolve
  - DOMAIN-SUFFIX,dns.google,Proxy
  - DOMAIN,cloudflare-dns.com,Proxy
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  # Steam China CDNs stay direct; the Steam group is for community / store
  - RULE-SET,steam-cn,DIRECT
  - DOMAIN-KEYWORD,steamcontent,DIRECT
  - DOMAIN-KEYWORD,steamcloud,DIRECT
  - DOMAIN-KEYWORD,steamcdn,DIRECT
  - DOMAIN-KEYWORD,steamstatic,DIRECT
  - RULE-SET,steam,Steam
  - RULE-SET,telegramcidr,Telegram,no-resolve
  - RULE-SET,telegram,Telegram
  - DOMAIN-SUFFIX,t.me,Telegram
  - DOMAIN-SUFFIX,telegram.org,Telegram
  - DOMAIN-SUFFIX,telegram.me,Telegram
  - DOMAIN-SUFFIX,telegra.ph,Telegram
  - DOMAIN-SUFFIX,telesco.pe,Telegram
  - DOMAIN-SUFFIX,tdesktop.com,Telegram
  - DOMAIN-KEYWORD,telegram,Telegram
  # Google / Play before reject and direct: reject lists gvt2.com, direct lists +.cn
  # and dl.google.com / redirector.gvt1.com, which would otherwise break Play downloads
  - DOMAIN-SUFFIX,googleapis.cn,Google
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,Google
  - DOMAIN,dl.google.com,Google
  - DOMAIN,dl.l.google.com,Google
  - DOMAIN,c.android.clients.google.com,Google
  - DOMAIN,update.googleapis.com,Google
  - DOMAIN,connectivitycheck.gstatic.com,Google
  - DOMAIN,checkin.gstatic.com,Google
  - DOMAIN-SUFFIX,gvt1.com,Google
  - DOMAIN-SUFFIX,gvt2.com,Google
  - DOMAIN-SUFFIX,gvt3.com,Google
  - DOMAIN-SUFFIX,googleapis.com,Google
  - DOMAIN-SUFFIX,googleusercontent.com,Google
  - DOMAIN-SUFFIX,google.com,Google
  - DOMAIN-SUFFIX,gstatic.com,Google
  - DOMAIN-SUFFIX,ggpht.com,Google
  - DOMAIN-SUFFIX,android.com,Google
  - DOMAIN-SUFFIX,googleplay.com,Google
  - DOMAIN-KEYWORD,googleplay,Google
  - DOMAIN-SUFFIX,gemini.google.com,Google
  - DOMAIN-SUFFIX,gemini.google,Google
  - DOMAIN-SUFFIX,aistudio.google.com,Google
  - DOMAIN-SUFFIX,bard.google.com,Google
  - DOMAIN-SUFFIX,deepmind.google,Google
  - DOMAIN-SUFFIX,labs.google,Google
  - DOMAIN-SUFFIX,labs.google.com,Google
  - DOMAIN-SUFFIX,notebooklm.google,Google
  - DOMAIN-SUFFIX,notebooklm.google.com,Google
  - DOMAIN-SUFFIX,jules.google,Google
  - DOMAIN-SUFFIX,jules.google.com,Google
  - DOMAIN-SUFFIX,antigravity.google,Google
  - DOMAIN-SUFFIX,generativeai.google,Google
  - DOMAIN-SUFFIX,makersuite.google.com,Google
  - DOMAIN-SUFFIX,ai.google.dev,Google
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,Google
  - RULE-SET,googlefcm,Google
  - RULE-SET,google,Google
  - DOMAIN-SUFFIX,anthropic.com,AI
  - DOMAIN-SUFFIX,claude.ai,AI
  - DOMAIN-SUFFIX,claude.com,AI
  - DOMAIN-SUFFIX,claudeusercontent.com,AI
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,oaistatic.com,AI
  - DOMAIN-SUFFIX,oaiusercontent.com,AI
  - DOMAIN-SUFFIX,x.ai,AI
  - DOMAIN-SUFFIX,grok.x.ai,AI
  - IP-CIDR,160.79.104.0/21,AI,no-resolve
  - RULE-SET,anthropic,AI
  - RULE-SET,openai,AI
  - RULE-SET,ai,AI
  - RULE-SET,reject,REJECT
  - RULE-SET,direct,DIRECT
