# vpsm subscription - user: __USER__
# Requires the Mihomo (Clash Meta) core: original Clash does not support VLESS Reality
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
profile:
  store-selected: true
  store-fake-ip: true

hosts:
  dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
  doh.pub:
    - 1.12.12.12
    - 120.53.53.53
  dns.cloudflare.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.google:
    - 8.8.8.8
    - 8.8.4.4

dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - geosite:private
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # Resolve the node itself without going through it
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  # Foreign DNS through the node itself, not a group that may be set to DIRECT
  nameserver:
    - "https://dns.cloudflare.com/dns-query#__NODE__"
    - "https://dns.google/dns-query#__NODE__"
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT

sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]

proxies:
  - name: "__NODE__"
    type: vless
    server: __SERVER__
    port: __PORT__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __SNI__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PBK__
      short-id: __SID__
      # Xray >= 26.9.8 rejects ClientHellos that omit X25519MLKEM768 (handshake falls back to dest)
      support-x25519mlkem768: true

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - "__NODE__"
      - DIRECT
  - name: AI
    type: select
    proxies:
      - Proxy
      - "__NODE__"
      - DIRECT
  - name: Google
    type: select
    proxies:
      - Proxy
      - "__NODE__"
      - DIRECT
  - name: Telegram
    type: select
    proxies:
      - Proxy
      - "__NODE__"
      - DIRECT
  - name: Steam
    type: select
    proxies:
      - Proxy
      - DIRECT
      - "__NODE__"
  - name: Final
    type: select
    proxies:
      - Proxy
      - DIRECT

# testingcf.jsdelivr.net is reachable from China without a proxy
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
  ai:
    type: http
    behavior: domain
    format: text
    url: "https://testingcf.jsdelivr.net/gh/666OS/rules@release/mihomo/domain/AI.txt"
    path: ./ruleset/ai.txt
    interval: 86400
  openai:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.yaml"
    path: ./ruleset/openai.yaml
    interval: 86400
  anthropic:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/anthropic.yaml"
    path: ./ruleset/anthropic.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.yaml"
    path: ./ruleset/google.yaml
    interval: 86400
  googlefcm:
