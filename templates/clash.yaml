# vpsm subscription - user: __USER__
# Requires the Mihomo (Clash Meta) core: original Clash does not support VLESS Reality
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxies:
  # Shown first in clients: next monthly traffic reset (not a usable server)
  - name: "下次重置：__RESET_DATE__"
    type: socks5
    server: 127.0.0.1
    port: 1
  - name: "__NODE__"
    type: vless
    server: __SERVER__
    port: __PORT__
    uuid: __UUID__
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: __SNI__
    client-fingerprint: chrome
    reality-opts:
      public-key: __PBK__
      short-id: __SID__
      # Xray >= 26.9.8 rejects ClientHellos that omit X25519MLKEM768 (handshake falls back to dest)
      support-x25519mlkem768: true

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - "下次重置：__RESET_DATE__"
      - "__NODE__"
      - DIRECT
  - name: Steam
    type: select
    proxies:
      - DIRECT
      - Proxy
  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT
      - Proxy
  - name: Final
    type: select
    proxies:
      - Proxy
      - DIRECT

# Rule sets from Loyalsoldier/clash-rules (whitelist mode) and MetaCubeX/meta-rules-dat (geosite),
# updated automatically by the client through the proxy (jsDelivr is unreliable from China)
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
    proxy: Proxy
  github:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.yaml"
    path: ./ruleset/github.yaml
    interval: 86400
    proxy: Proxy
  steam-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam@cn.yaml"
    path: ./ruleset/steam-cn.yaml
    interval: 86400
    proxy: Proxy
  steam:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam.yaml"
    path: ./ruleset/steam.yaml
    interval: 86400
    proxy: Proxy
  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
    proxy: Proxy
  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
    proxy: Proxy
  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
    proxy: Proxy
  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400
    proxy: Proxy
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
    proxy: Proxy
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
    proxy: Proxy
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
    proxy: Proxy

rules:
  # __CUSTOM_RULES__
  # The server blocks proxied connections to its own addresses, so services on this VPS go direct
  # __SERVER_RULES__
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,AdBlock
  - RULE-SET,github,Proxy
  - RULE-SET,steam-cn,DIRECT
  - RULE-SET,steam,Steam
  # direct goes before proxy/gfw: its entries under foreign suffixes (Google CN, Apple/Microsoft China CDNs)
  # are deliberate exceptions, and proxying them fails whenever they resolve to Chinese IPs
  - RULE-SET,direct,DIRECT
  # QUIC tunneled over TCP performs poorly; browsers fall back to TCP right away
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,gfw,Proxy
  - RULE-SET,lancidr,DIRECT,no-resolve
  # The CN IP rules resolve unmatched domains: domestic sites missing from the direct list would
  # otherwise go through the proxy, and the server blocks Chinese IPs
  - RULE-SET,cncidr,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,Final
